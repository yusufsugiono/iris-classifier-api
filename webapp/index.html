<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iris Classifier</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      html, body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      #content {
        flex: 1;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Iris Classifier</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html" id="nav-predict"
                >Prediksi</a>
            </li>
        </div>
      </div>
    </nav>

    <div class="container mt-4" id="content">
      <h3>Prediksi Iris</h3>
      <form id="predictForm">
        <div class="mb-3">
          <label for="sepal_length" class="form-label">Sepal Length</label>
          <input
            type="number"
            step="any"
            class="form-control"
            id="sepal_length"
            required
          />
        </div>
        <div class="mb-3">
          <label for="sepal_width" class="form-label">Sepal Width</label>
          <input
            type="number"
            step="any"
            class="form-control"
            id="sepal_width"
            required
          />
        </div>
        <div class="mb-3">
          <label for="petal_length" class="form-label">Petal Length</label>
          <input
            type="number"
            step="any"
            class="form-control"
            id="petal_length"
            required
          />
        </div>
        <div class="mb-3">
          <label for="petal_width" class="form-label">Petal Width</label>
          <input
            type="number"
            step="any"
            class="form-control"
            id="petal_width"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary">Predict</button>
      </form>
    </div>

    <footer class="bg-light text-center text-lg-start mt-5">
      <div class="text-center p-3 border-top">
        © 2025 Iris Classifier by
        <a
          href="https://github.com/yusufsugiono/iris-classifier-api"
          target="_blank"
          >yusufsugiono</a
        >
      </div>
    </footer>
  </body>
</html>
